name: PFP Bootstrap Chunk Integrity

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
  workflow_dispatch:

jobs:
  chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every Base64 text chunk
        shell: bash
        run: |
          set -euo pipefail
          C=supabase/bootstrap/byteexact_chunks
          cat > /tmp/chunks.sha256 <<'EOF'
