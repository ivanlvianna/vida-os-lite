name: Gate 0 promote bootstrap

on:
  push:
    branches:
      - gate-0-schema-as-code
    paths:
      - .github/workflows/gate0-promote-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gate-0-schema-as-code
          fetch-depth: 0

      - name: Verify exact qualified candidate
        run: |
          set -euo pipefail
          test "$(wc -c < supabase/bootstrap/production_schema_20260913.CANDIDATE.sql | tr -d ' ')" = "100307"
          echo "188be8b6bc309c911f9973d00d1bbb158108cecfe6927aacf8a4f50d2c6cae4d  supabase/bootstrap/production_schema_20260913.CANDIDATE.sql" | sha256sum -c -

      - name: Promote without changing SQL bytes
        run: |
          set -euo pipefail
          git mv supabase/bootstrap/production_schema_20260913.CANDIDATE.sql \
                 supabase/bootstrap/production_schema_20260913.sql
          rm supabase/bootstrap/production_schema_20260913.CANDIDATE.sha256
          echo "188be8b6bc309c911f9973d00d1bbb158108cecfe6927aacf8a4f50d2c6cae4d  production_schema_20260913.sql" > supabase/bootstrap/production_schema_20260913.sha256
          echo "188be8b6bc309c911f9973d00d1bbb158108cecfe6927aacf8a4f50d2c6cae4d  supabase/bootstrap/production_schema_20260913.sql" | sha256sum -c -

      - name: Commit promotion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A supabase/bootstrap
          git commit -m "chore(db): promote qualified canonical bootstrap"
          git push origin HEAD:gate-0-schema-as-code
