name: PFP D3 Ledger Text Transport Proof

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify exact D3 ledger samples
        shell: bash
        run: |
          set -euo pipefail
          DIR='supabase/bootstrap/d3_ledger_exact'
          verify() {
            file="$1"; expected_bytes="$2"; expected_md5="$3"
            base64 -d "$DIR/$file.sql.b64" > "/tmp/$file.sql"
            got_bytes="$(wc -c < "/tmp/$file.sql" | tr -d ' ')"
            got_md5="$(md5sum "/tmp/$file.sql" | awk '{print $1}')"
            echo "$file bytes=$got_bytes md5=$got_md5"
            test "$got_bytes" = "$expected_bytes"
            test "$got_md5" = "$expected_md5"
          }
          verify '20260913214041_v0_7_onboard_client_account_member' 3292 00b66beff0b48e3a493231cdd329ca1f
          verify '20260915003143_pc_m01_actor_authorship_infrastructure' 2738 c2d19c8958952391985d2ee882c772a3
          verify '20260915010615_pc_performance_targeted_indexes_v1' 1469 95cf1962dfec09bb69bdc07587c8da3b
          verify '20260915022715_pc_m09_staff_summary_visibility_fix' 2757 ad3e1bef37e6a75ebc4ca0d1761ccd08
          echo 'D3_LEDGER_TEXT_TRANSPORT_SAMPLE_PASS'
      - name: Mark transport sample complete
        run: echo 'transport sample verified at current branch head'
