name: PFP Bootstrap Replay Proof — Isolate Invalid Chunks

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate each Base64 chunk independently
        shell: bash
        run: |
          set -u
          C=supabase/bootstrap/byteexact_chunks
          rc=0
          for f in \
            "$C/v06_01.b64part" "$C/v06_02.b64part" "$C/v06_03.b64part" \
            "$C/v06_04a.b64part" "$C/v06_04b.b64part" "$C/v06_05.b64part" \
            "$C/pchist_01.b64part" "$C/pchist_02.b64part" "$C/pchist_03.b64part" \
            "$C/pchist_04.b64part" "$C/pchist_05.b64part"
          do
            chars="$(wc -c < "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            if base64 -d "$f" >/tmp/out.bin 2>/tmp/base64.err; then
              bytes="$(wc -c </tmp/out.bin)"
              echo "VALID|$f|chars=$chars|decoded_bytes=$bytes|sha256=$sha"
            else
              err="$(tr '\n' ' ' </tmp/base64.err)"
              echo "INVALID|$f|chars=$chars|sha256=$sha|error=$err"
              rc=1
            fi
          done
          exit "$rc"
