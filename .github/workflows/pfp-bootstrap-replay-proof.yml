name: PFP Planning History Archive Diagnostic

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct Planning Content archive only
        shell: bash
        run: |
          set -euo pipefail
          HIST='supabase/history/archives/PLANNING_CONTENT_EXACT_APPLIED_HISTORY_20260914.tar.gz'
          echo "FILE_BYTES=$(wc -c < "$HIST")"
          echo "FILE_SHA256=$(sha256sum "$HIST" | awk '{print $1}')"
          file "$HIST"
          tar -tzf "$HIST" > /tmp/list.txt
          echo 'TAR_READABLE=YES'
          cat /tmp/list.txt
          count="$(grep -Ec '(^|/)2026[0-9]+_.*\.sql$' /tmp/list.txt)"
          echo "SQL_COUNT=$count"
          test "$count" -eq 28
