name: PFP Supabase Credential Presence Probe

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL SUPABASE_DB_URL SUPABASE_DATABASE_URL SUPABASE_DB_PASSWORD SUPABASE_ACCESS_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=ABSENT"; fi
          done
      - name: Read canonical ledger if a database URL is present
        shell: bash
        run: |
          set -euo pipefail
          URL="${SUPABASE_DB_URL:-${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}}"
          if [ -z "$URL" ]; then
            echo 'NO_DATABASE_URL_AVAILABLE'
            exit 0
          fi
          psql "$URL" -v ON_ERROR_STOP=1 -Atc "select count(*)||'|'||min(version)||'|'||max(version) from supabase_migrations.schema_migrations;"
