name: PFP Bootstrap Replay Proof — Recover Missing Base64 Character

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brute force missing final Base64 character
        shell: bash
        run: |
          set -euo pipefail
          C=supabase/bootstrap/byteexact_chunks
          expected='bfff89688a1490c00ddcb6dd1118982217ba2075db921c6500bb06aaeae7ab4c'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          base="$(cat "$C/pchist_02.b64part")"
          found=''
          for ((i=0; i<${#alphabet}; i++)); do
            ch="${alphabet:$i:1}"
            {
              cat "$C/pchist_01.b64part"
              printf '%s%s' "$base" "$ch"
              cat "$C/pchist_03.b64part" "$C/pchist_04.b64part" "$C/pchist_05.b64part"
            } | base64 -d >/tmp/candidate.tar.gz 2>/dev/null || continue
            sha="$(sha256sum /tmp/candidate.tar.gz | awk '{print $1}')"
            if [ "$sha" = "$expected" ]; then
              found="$ch"
              echo "RECOVERED_CHARACTER=$ch"
              echo "RECOVERED_SHA256=$sha"
              tar -tzf /tmp/candidate.tar.gz >/tmp/list.txt
              count="$(grep -Ec '(^|/)2026[0-9]+_.*\.sql$' /tmp/list.txt)"
              echo "RECOVERED_SQL_COUNT=$count"
              test "$count" -eq 28
              break
            fi
          done
          test -n "$found"
