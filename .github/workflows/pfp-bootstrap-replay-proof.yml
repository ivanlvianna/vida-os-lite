name: PFP Bootstrap Replay Proof — Chunk Semantic Diagnostic

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct artifacts and test semantic readability
        shell: bash
        run: |
          set -euo pipefail
          C=supabase/bootstrap/byteexact_chunks

          cat "$C/v06_01.b64part" "$C/v06_02.b64part" "$C/v06_03.b64part" \
              "$C/v06_04a.b64part" "$C/v06_04b.b64part" "$C/v06_05.b64part" \
            | base64 -d > /tmp/v06.sql.gz

          cat "$C/pchist_01.b64part" "$C/pchist_02.b64part" "$C/pchist_03.b64part" \
              "$C/pchist_04.b64part" "$C/pchist_05.b64part" \
            | base64 -d > /tmp/planning-content-history.tar.gz

          echo "reconstructed v0.6 sha256=$(sha256sum /tmp/v06.sql.gz | awk '{print $1}')"
          echo "reconstructed history sha256=$(sha256sum /tmp/planning-content-history.tar.gz | awk '{print $1}')"
          echo "reconstructed v0.6 bytes=$(wc -c </tmp/v06.sql.gz)"
          echo "reconstructed history bytes=$(wc -c </tmp/planning-content-history.tar.gz)"

          gzip -t /tmp/v06.sql.gz
          echo 'V06_GZIP_READABLE=YES'

          tar -tzf /tmp/planning-content-history.tar.gz >/tmp/history-list.txt
          count="$(grep -Ec '(^|/)2026[0-9]+_.*\.sql$' /tmp/history-list.txt)"
          echo "HISTORY_TAR_READABLE=YES"
          echo "HISTORY_SQL_COUNT=$count"
          test "$count" -eq 28

          gunzip -c /tmp/v06.sql.gz | sha256sum | sed 's/^/v0.6 uncompressed sha256=/'
          tar -xzf /tmp/planning-content-history.tar.gz -C /tmp
          find /tmp -type f -name '2026*.sql' -print0 | sort -z | xargs -0 cat | sha256sum | sed 's/^/history concatenated SQL sha256=/'
