name: PFP Current Planning Bootstrap Diagnostic

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current Planning Content bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOT='supabase/bootstrap/PLANNING_CONTENT_CURRENT_BOOTSTRAP_20260914.sql.gz'
          echo "FILE_BYTES=$(wc -c < "$BOOT")"
          echo "FILE_SHA256=$(sha256sum "$BOOT" | awk '{print $1}')"
          file "$BOOT"
          gzip -t "$BOOT"
          echo 'GZIP_READABLE=YES'
          gunzip -c "$BOOT" > /tmp/planning_content_current.sql
          echo "SQL_BYTES=$(wc -c < /tmp/planning_content_current.sql)"
          echo "SQL_SHA256=$(sha256sum /tmp/planning_content_current.sql | awk '{print $1}')"
          grep -Eci 'create[[:space:]]+(table|view|or replace function)' /tmp/planning_content_current.sql
          head -n 5 /tmp/planning_content_current.sql
