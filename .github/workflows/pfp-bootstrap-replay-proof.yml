name: PFP Cockpit Current Branch Validation

on:
  push:
    branches:
      - pfp-bootstrap-replay-proof-byteexact-2026-09-14
    paths:
      - '.github/workflows/pfp-bootstrap-replay-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: pfp-ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: pfp-ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
